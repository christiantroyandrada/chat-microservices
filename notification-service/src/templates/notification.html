<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{TITLE}}</title>
    <style>
      :root { color-scheme: light dark; }
      .canvas { background-color: #f5efe4; }
      .letter { background-color: #faf6ee; }
      .rule { border-color: #d8cbbd; }
      .ink { color: #30231c; }
      .detail { color: #625044; }
      .accent { background-color: #9d372c; color: #faf6ee; }
      @media (prefers-color-scheme: dark) {
        .canvas { background-color: #1e1612; }
        .letter { background-color: #2a211a; }
        .rule { border-color: #514237; }
        .ink { color: #ebe4db; }
        .detail { color: #c8beb3; }
        .accent { background-color: #d8654e; color: #1b110d; }
      }
    </style>
  </head>
  <body class="canvas ink" style="margin:0;padding:0;font-family:Verdana, sans-serif;">
    <table role="presentation" class="canvas" style="width:100%;border-spacing:0;">
      <tr>
        <td style="padding:24px 12px;">
          <table role="presentation" class="letter rule" style="width:100%;max-width:560px;margin:0 auto;border-spacing:0;border-width:1px;border-style:solid;border-radius:16px;">
            <tr>
              <td class="rule" style="padding:24px;border-bottom-width:1px;border-bottom-style:solid;">
                <span class="accent" aria-hidden="true" style="display:inline-block;width:36px;line-height:36px;margin-right:10px;border-radius:50%;text-align:center;font-size:20px;vertical-align:middle;">&#9993;&#65038;</span>
                <span class="ink" style="font:bold 24px Georgia, serif;vertical-align:middle;">Secret</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <h1 class="ink" style="margin:0 0 12px;font:bold 28px/1.25 Georgia, serif;overflow-wrap:anywhere;">{{TITLE}}</h1>
                <p class="detail" style="margin:0 0 24px;font-size:15px;line-height:1.6;overflow-wrap:anywhere;">{{BODY}}</p>
                <a class="accent" href="{{APP_URL}}" style="display:inline-block;padding:12px 20px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:bold;line-height:20px;">Open Secret</a>
              </td>
            </tr>
            <tr>
              <td class="detail rule" style="padding:16px 24px;border-top-width:1px;border-top-style:solid;font-size:12px;line-height:1.5;overflow-wrap:anywhere;">
                © {{YEAR}} Secret · {{EMAIL_FROM}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
