<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        .canvas { background-color: #1e1612 !important; }
        .letter { background-color: #2a211a !important; }
        .rule { border-color: #514237 !important; }
        .ink { color: #ebe4db !important; }
        .detail { color: #c8beb3 !important; }
        .accent { background-color: #d8654e !important; color: #1b110d !important; }
      }
    </style>
  </head>
  <body class="canvas ink" style="margin:0;padding:0;background-color:#f5efe4;color:#30231c;font-family:Verdana, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="canvas" bgcolor="#f5efe4" style="background-color:#f5efe4;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="letter rule" bgcolor="#faf6ee" style="max-width:560px;background-color:#faf6ee;border:1px solid #d8cbbd;border-radius:16px;">
            <tr>
              <td class="rule" style="padding:24px;border-bottom:1px solid #d8cbbd;">
                <span class="accent" aria-hidden="true" style="display:inline-block;width:36px;line-height:36px;margin-right:10px;border-radius:50%;background-color:#9d372c;color:#faf6ee;text-align:center;font-size:20px;vertical-align:middle;">&#9993;&#65038;</span>
                <span class="ink" style="font: bold 24px Georgia, serif;color:#30231c;vertical-align:middle;">Secret</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <h1 class="ink" style="margin:0 0 12px;color:#30231c;font:bold 28px/1.25 Georgia, serif;overflow-wrap:anywhere;">Welcome to Secret</h1>
                <p class="detail" style="margin:0 0 24px;color:#625044;font-size:15px;line-height:1.6;overflow-wrap:anywhere;">Your account is ready. Find someone you know and send your first message.</p>
                <a class="accent" href="{{APP_URL}}" style="display:inline-block;padding:12px 20px;border-radius:8px;background-color:#9d372c;color:#faf6ee;text-decoration:none;font-size:15px;font-weight:bold;line-height:20px;">Open Secret</a>
              </td>
            </tr>
            <tr>
              <td class="detail rule" style="padding:16px 24px;border-top:1px solid #d8cbbd;color:#625044;font-size:12px;line-height:1.5;overflow-wrap:anywhere;">
                © {{YEAR}} Secret · {{EMAIL_FROM}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
