---
name: CI - Unit Tests

on:
  workflow_call:
    inputs:
      coverage:
        description: 'Whether to generate coverage (lcov) and upload/merge artifacts (true/false)'
        required: true
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Run all 3 service test suites even if one fails — gives complete visibility
      # into the full test health of the repo on every push.
      fail-fast: false
      matrix:
        service: ["user-service", "notification-service", "chat-service"]
    steps:
      - name: Checkout repository
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies for service
        run: npm ci --prefix ${{ matrix.service }}

      - name: Run tests (coverage optional)
        run: |
          set -euo pipefail
          echo "Running tests for ${{ matrix.service }}"
          if [ "${{ inputs.coverage }}" = "true" ]; then
            npm run coverage --prefix ${{ matrix.service }}
          else
            echo "coverage disabled by caller; running unit tests only for ${{ matrix.service }}"
            npm run test:unit --prefix ${{ matrix.service }}
          fi

      - name: Prepare LCOV for upload (if present)
        if: ${{ inputs.coverage == 'true' }}
        run: |
          set -euo pipefail
          SRC="${{ matrix.service }}/coverage/lcov.info"
          DST_DIR="./upload/${{ matrix.service }}"
          test -s "$SRC"
          mkdir -p "$DST_DIR"
          cp "$SRC" "$DST_DIR/lcov.info"

      - name: Upload LCOV (if present)
        if: ${{ inputs.coverage == 'true' }}
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-${{ matrix.service }}
          path: upload/${{ matrix.service }}
          if-no-files-found: error

  merge-and-upload:
    if: ${{ inputs.coverage == 'true' }}
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Merge LCOV reports and upload combined artifact
    steps:
      - name: Checkout repository
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all LCOV artifacts
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: ./artifacts
          merge-multiple: false

      - name: Merge LCOV files
        run: |
          set -euo pipefail
          bash scripts/normalize-lcov.sh ./artifacts coverage/combined-lcov.info

      - name: Upload combined LCOV
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-lcov
          path: coverage/combined-lcov.info
          if-no-files-found: error

  sonar:
    if: ${{ inputs.coverage == 'true' }}
    name: SonarCloud Scan (reusable)
    needs: merge-and-upload
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
