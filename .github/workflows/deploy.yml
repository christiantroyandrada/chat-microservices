name: Backend Release

on:
  workflow_call:
    inputs:
      user_digest:
        description: Digest for chat-user-service image (sha256:...)
        required: true
        type: string
      chat_digest:
        description: Digest for chat-chat-service image (sha256:...)
        required: true
        type: string
      notification_digest:
        description: Digest for chat-notification-service image (sha256:...)
        required: true
        type: string
      nginx_digest:
        description: Digest for chat-nginx image (sha256:...)
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false
      PGADMIN_EMAIL:
        required: false
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_PRIVATE_KEY:
        required: true
      VPS_PORT:
        required: true
      INFISCAL_CLIENT_ID:
        required: true
      INFISCAL_CLIENT_SECRET:
        required: true
      INFISCAL_PROJECT_SLUG:
        required: true
      VPS_SUDO_PASSWORD:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy owned backend release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout release script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISCAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISCAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISCAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Validate release input
        env:
          USER_DIGEST: ${{ inputs.user_digest }}
          CHAT_DIGEST: ${{ inputs.chat_digest }}
          NOTIFICATION_DIGEST: ${{ inputs.notification_digest }}
          NGINX_DIGEST: ${{ inputs.nginx_digest }}
        run: |
          for d in "$USER_DIGEST" "$CHAT_DIGEST" "$NOTIFICATION_DIGEST" "$NGINX_DIGEST"; do
            if ! echo "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "digest must be sha256:<64 lowercase hex>" >&2
              exit 1
            fi
          done

      - name: Verify migration policy
        run: node scripts/verify-migration-policy.mjs

      - name: Deploy owned backend release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_ENCODED: ${{ env.ADMIN_PASSWORD_ENCODED }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}
          MESSAGE_BROKER_URL: ${{ env.MESSAGE_BROKER_URL }}
          SENDINBLUE_APIKEY: ${{ env.SENDINBLUE_APIKEY }}
          SMTP_HOST: ${{ env.SMTP_HOST }}
          SMTP_PASS: ${{ env.SMTP_PASS }}
          SMTP_USER: ${{ env.SMTP_USER }}
          EMAIL_FROM: ${{ env.EMAIL_FROM }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_IMAGE: ghcr.io/${{ github.repository_owner }}/chat-user-service@${{ inputs.user_digest }}
          CHAT_IMAGE: ghcr.io/${{ github.repository_owner }}/chat-chat-service@${{ inputs.chat_digest }}
          NOTIFICATION_IMAGE: ghcr.io/${{ github.repository_owner }}/chat-notification-service@${{ inputs.notification_digest }}
          NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/chat-nginx@${{ inputs.nginx_digest }}
          REPO_OWNER: ${{ github.repository_owner }}
          DB_USER_SVC_PASS: ${{ env.DB_USER_SVC_PASS }}
          DB_CHAT_SVC_PASS: ${{ env.DB_CHAT_SVC_PASS }}
          DB_NOTIF_SVC_PASS: ${{ env.DB_NOTIF_SVC_PASS }}
          MIGRATIONS_ROLLBACK_SAFE: 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: ADMIN_USERNAME,ADMIN_PASSWORD,ADMIN_PASSWORD_ENCODED,CORS_ORIGINS,MESSAGE_BROKER_URL,SENDINBLUE_APIKEY,SMTP_HOST,SMTP_PASS,SMTP_USER,EMAIL_FROM,PGADMIN_EMAIL,GITHUB_TOKEN,USER_IMAGE,CHAT_IMAGE,NOTIFICATION_IMAGE,NGINX_IMAGE,REPO_OWNER,DB_USER_SVC_PASS,DB_CHAT_SVC_PASS,DB_NOTIF_SVC_PASS,MIGRATIONS_ROLLBACK_SAFE
          script_path: deploy/release-backend.sh
