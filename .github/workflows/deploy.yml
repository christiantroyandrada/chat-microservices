name: Backend Release

on:
  workflow_call:
    inputs:
      image_tag:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false
      PGADMIN_EMAIL:
        required: false
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_PRIVATE_KEY:
        required: true
      VPS_PORT:
        required: true
      INFISCAL_CLIENT_ID:
        required: true
      INFISCAL_CLIENT_SECRET:
        required: true
      INFISCAL_PROJECT_SLUG:
        required: true
      VPS_SUDO_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
      reason:
        description: Why this immutable release is being deployed
        required: false
        type: string
        default: Manual release

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy owned backend release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout release script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISCAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISCAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISCAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Validate release input
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "image_tag must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - name: Verify migration policy
        run: node scripts/verify-migration-policy.mjs

      - name: Deploy owned backend release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_ENCODED: ${{ env.ADMIN_PASSWORD_ENCODED }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}
          MESSAGE_BROKER_URL: ${{ env.MESSAGE_BROKER_URL }}
          SENDINBLUE_APIKEY: ${{ env.SENDINBLUE_APIKEY }}
          SMTP_HOST: ${{ env.SMTP_HOST }}
          SMTP_PASS: ${{ env.SMTP_PASS }}
          SMTP_USER: ${{ env.SMTP_USER }}
          EMAIL_FROM: ${{ env.EMAIL_FROM }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          DB_USER_SVC_PASS: ${{ env.DB_USER_SVC_PASS }}
          DB_CHAT_SVC_PASS: ${{ env.DB_CHAT_SVC_PASS }}
          DB_NOTIF_SVC_PASS: ${{ env.DB_NOTIF_SVC_PASS }}
          MIGRATIONS_ROLLBACK_SAFE: 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: ADMIN_USERNAME,ADMIN_PASSWORD,ADMIN_PASSWORD_ENCODED,CORS_ORIGINS,MESSAGE_BROKER_URL,SENDINBLUE_APIKEY,SMTP_HOST,SMTP_PASS,SMTP_USER,EMAIL_FROM,PGADMIN_EMAIL,GITHUB_TOKEN,IMAGE_TAG,REPO_OWNER,DB_USER_SVC_PASS,DB_CHAT_SVC_PASS,DB_NOTIF_SVC_PASS,MIGRATIONS_ROLLBACK_SAFE
          script_path: deploy/release-backend.sh
