name: CI Pipeline [main]

on:
  push:
    branches: [main]

# Permissions for GHCR push and security scanning
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  # Image names (lowercase required for GHCR)
  IMAGE_USER: ghcr.io/${{ github.repository_owner }}/chat-user-service
  IMAGE_CHAT: ghcr.io/${{ github.repository_owner }}/chat-chat-service
  IMAGE_NOTIFICATION: ghcr.io/${{ github.repository_owner }}/chat-notification-service
  IMAGE_NGINX: ghcr.io/${{ github.repository_owner }}/chat-nginx

jobs:
  build:
    name: Build & Audit — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # All 3 services build in parallel; fail-fast: false so audit results are
      # always visible even if one service fails to compile.
      fail-fast: false
      matrix:
        service: [user-service, chat-service, notification-service]

    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          # Cache the npm store keyed per service so each matrix job gets its
          # own cache bucket (cache-dependency-path drives the cache key).
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          npm ci
          npm run build

      - name: Audit ${{ matrix.service }}
        continue-on-error: true
        working-directory: ./${{ matrix.service }}
        run: npm audit --audit-level=moderate

  typescript-check:
    name: TypeScript Type Check
    needs: build
    uses: ./.github/workflows/typescript-check.yml

  verify-openapi-contracts:
    name: Verify committed OpenAPI contracts
    needs: typescript-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            user-service/package-lock.json
            chat-service/package-lock.json

      - name: Install contract generator dependencies
        run: |
          npm --prefix user-service ci
          npm --prefix chat-service ci

      - name: Verify committed OpenAPI contracts
        run: |
          node --test tests/contract-artifacts.test.mjs tests/contract-verifier.test.mjs
          node scripts/verify-contract-artifacts.mjs
          node --test tests/release-contract-pair.test.mjs
          node --test tests/migration-policy.test.mjs
          node scripts/verify-migration-policy.mjs
          node --test tests/deployment-workflow.test.mjs
          node scripts/verify-deployment-workflow.mjs
          node --test tests/coverage-workflow.test.mjs tests/security-workflow.test.mjs

  security-audit:
    name: Security Audit
    needs: verify-openapi-contracts
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  unit-tests:
    name: Unit Tests & Coverage
    needs: verify-openapi-contracts
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/unit-tests.yml
    with:
      coverage: 'true'
    secrets: inherit

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration-tests.yml

  # Build and push Docker images to GitHub Container Registry
  docker-build:
    name: Build & Push Docker Images
    needs: [integration-tests, security-audit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      user_digest: ${{ steps.build-user.outputs.digest }}
      chat_digest: ${{ steps.build-chat.outputs.digest }}
      notification_digest: ${{ steps.build-notification.outputs.digest }}
      nginx_digest: ${{ steps.build-nginx.outputs.digest }}
    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build user-service for security scan
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./user-service
          push: false
          load: true
          tags: chat-user-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build chat-service for security scan
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./chat-service
          push: false
          load: true
          tags: chat-chat-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build notification-service for security scan
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./notification-service
          push: false
          load: true
          tags: chat-notification-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx for security scan
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./nginx
          push: false
          load: true
          tags: chat-nginx:scan
          build-args: |
            NGINX_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan user-service release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-user-service:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Scan chat-service release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-chat-service:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Scan notification-service release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-notification-service:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Scan nginx release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-nginx:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Publish user-service
        id: build-user
        env:
          SCAN_IMAGE: chat-user-service:scan
          RELEASE_IMAGE: ${{ env.IMAGE_USER }}
        run: &publish-scanned-image |
          docker tag "$SCAN_IMAGE" "$RELEASE_IMAGE:$GITHUB_SHA"
          push_output="$(docker push "$RELEASE_IMAGE:$GITHUB_SHA")"
          printf '%s\n' "$push_output"
          digest="$(awk -v tag="$GITHUB_SHA:" '$1 == tag && $2 == "digest:" { print $3 }' <<< "$push_output")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid registry digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker tag "$SCAN_IMAGE" "$RELEASE_IMAGE:latest"
          docker push "$RELEASE_IMAGE:latest"

      - name: Publish chat-service
        id: build-chat
        env:
          SCAN_IMAGE: chat-chat-service:scan
          RELEASE_IMAGE: ${{ env.IMAGE_CHAT }}
        run: *publish-scanned-image

      - name: Publish notification-service
        id: build-notification
        env:
          SCAN_IMAGE: chat-notification-service:scan
          RELEASE_IMAGE: ${{ env.IMAGE_NOTIFICATION }}
        run: *publish-scanned-image

      - name: Publish nginx
        id: build-nginx
        env:
          SCAN_IMAGE: chat-nginx:scan
          RELEASE_IMAGE: ${{ env.IMAGE_NGINX }}
        run: *publish-scanned-image

  deploy:
    name: Deploy to VPS
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      user_digest: ${{ needs.docker-build.outputs.user_digest }}
      chat_digest: ${{ needs.docker-build.outputs.chat_digest }}
      notification_digest: ${{ needs.docker-build.outputs.notification_digest }}
      nginx_digest: ${{ needs.docker-build.outputs.nginx_digest }}
    secrets: inherit
