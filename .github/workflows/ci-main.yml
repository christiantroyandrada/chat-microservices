name: CI Pipeline [main]

on:
  push:
    branches: [main]

# Permissions for GHCR push and security scanning
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  # Image names (lowercase required for GHCR)
  IMAGE_USER: ghcr.io/${{ github.repository_owner }}/chat-user-service
  IMAGE_CHAT: ghcr.io/${{ github.repository_owner }}/chat-chat-service
  IMAGE_NOTIFICATION: ghcr.io/${{ github.repository_owner }}/chat-notification-service
  IMAGE_NGINX: ghcr.io/${{ github.repository_owner }}/chat-nginx

jobs:
  build:
    name: Build & Audit — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # All 3 services build in parallel; fail-fast: false so audit results are
      # always visible even if one service fails to compile.
      fail-fast: false
      matrix:
        service: [user-service, chat-service, notification-service]

    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          # Cache the npm store keyed per service so each matrix job gets its
          # own cache bucket (cache-dependency-path drives the cache key).
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          npm ci
          npm run build

      - name: Audit ${{ matrix.service }}
        continue-on-error: true
        working-directory: ./${{ matrix.service }}
        run: npm audit --audit-level=moderate

  typescript-check:
    name: TypeScript Type Check
    needs: build
    uses: ./.github/workflows/typescript-check.yml

  verify-openapi-contracts:
    name: Verify committed OpenAPI contracts
    needs: typescript-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            user-service/package-lock.json
            chat-service/package-lock.json

      - name: Install contract generator dependencies
        run: |
          npm --prefix user-service ci
          npm --prefix chat-service ci

      - name: Verify committed OpenAPI contracts
        run: |
          node --test tests/contract-artifacts.test.mjs tests/contract-verifier.test.mjs
          node scripts/verify-contract-artifacts.mjs

  security-audit:
    name: Security Audit
    needs: verify-openapi-contracts
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  unit-tests:
    name: Unit Tests & Coverage
    # Runs after typescript-check; does NOT wait for security-audit
    # so audit findings never block tests or deployment
    needs: verify-openapi-contracts
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/unit-tests.yml
    with:
      coverage: 'true'
    secrets: inherit

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration-tests.yml

  # Build and push Docker images to GitHub Container Registry
  docker-build:
    name: Build & Push Docker Images
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./user-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-user-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chat-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push chat-service
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./chat-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-chat-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chat-chat-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notification-service
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./notification-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-notification-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chat-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-nginx:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chat-nginx:latest
          build-args: |
            NGINX_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
